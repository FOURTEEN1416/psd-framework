# P0.5 ST-GCN+BC 完整训练配置（W12 窗口）
# 口径: 合成层（synthetic）
# 参照: K9 phase-3 合成 46.97% @ epoch 21

data:
  synthetic_path: data/synthetic/syn_22class_100per_class_seed42.pkl
  T: 30
  seed: 42
  val_split: 0.2

model:
  in_channels: 3
  num_classes: 22
  base_channels: 64
  num_stages: 10

train:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 32
  use_amp: true
  device: auto
  early_stopping: true
  patience: 15
  output_dir: runs/p05_stgcn_bc_full

# 达标判定（非硬线——合成层 ≠ 真实 K9 层）
evaluation:
  synthetic_reference: 0.4697  # K9 phase-3 合成 46.97%
  random_baseline: 0.045       # 22 类随机猜测
  convergence_threshold: 0.135 # 显著超基线（4.5% × 3）
