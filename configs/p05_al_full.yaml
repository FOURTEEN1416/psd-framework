# P0.5 主动学习效率实验 — full-budget 版（W14 窗口，待 GPU 空闲后一键复跑）
#
# 一键复跑:
#   .venv\Scripts\python.exe scripts\run_p05_al_efficiency.py --config configs/p05_al_full.yaml --fresh
#
# 与 short 版差异: epochs 50→120、patience 25、device auto(GPU)、AMP 开启。
# 其余协议参数（池/验证集种子、预算、seeds、策略）与 short 版完全一致以保证可比性。
# ⚠️ 复跑时把 output.report_json 的 RUNDATE 替换为当日日期。

experiment:
  name: p05_al_efficiency_full
  layer: synthetic
  budgets: [20, 50, 100, 200]
  seeds: [42, 43, 44]
  strategies: [entropy, random]
  uncertainty_method: softmax_entropy

pool:
  samples_per_class: 10     # 22×10 = 220 ≥ 预算上限 200
  T: 30
  noise_std: 0.05
  seed: 20261

val:
  samples_per_class: 15     # 22×15 = 330 固定 GT 验证集
  T: 30
  noise_std: 0.05
  seed: 20262

model:
  in_channels: 3
  num_classes: 22
  base_channels: 64
  num_stages: 10

train:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 120               # full-budget 完整收敛预算（short=50）
  batch_size: 32
  warmup_epochs: 5
  early_stopping: true
  patience: 25
  use_amp: true             # GPU 混合精度
  device: auto              # NTU 长训释放后自动用 GPU
  output_dir: runs/p05_al_efficiency/full

pool_scoring:
  enabled: true
  pool_jsonl: data/processed/p04/pseudo_pool_main_consensus_a1.0_seed42.jsonl
  smal_npy_dir: D:/Desktop/k9-training-system/data/interpet4d/smal_npy
  ckpt: runs/p05_stgcn_bc_full/best.pt

output:
  report_json: reports/p05-al-efficiency-full-2026-08-25.json
  state_dir: runs/p05_al_efficiency/state_full
