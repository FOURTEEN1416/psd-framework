# P0.5 ST-GCN+BC 训练配置（W11 冒烟）
# 对照 K9 仓默认：lr=1e-3, batch=32, epochs=100, early_stopping_patience=20

run_name: "p05_stgcn_bc"
work_root: "data/processed/p05"

# 数据（合成层）
samples_per_class: 50    # 冒烟用 50；W12 达标实验扩到 200+
T: 30
noise_std: 0.05
seed: 42

# 模型
in_channels: 3
num_classes: 22
base_channels: 64
num_stages: 10
boundary_weight: 0.3

# 训练
lr: 1.0e-3
weight_decay: 1.0e-4
batch_size: 32
epochs: 50               # 冒烟 50 轮足够验证收敛方向
val_interval: 1
save_interval: 5
lr_scheduler: "cosine"
warmup_epochs: 5
early_stopping: true
patience: 15
use_amp: true
device: "auto"
grad_clip: 1.0
output_dir: "runs/p05_stgcn_bc"
