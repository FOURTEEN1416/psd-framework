  dogpose_c5_w29:
    n: 8476
    slot: augment_static
    reason: 任务书范围外（任务书点名 APTv2+DogSet）；静态 GT 与提点链噪声风格不同源，
      混入会稀释归因。留待后续增广专项。
  ak_public_q3b_in_pool:
