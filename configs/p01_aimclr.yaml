# P0.1 AimCLR 自监督预训练 — InterPet4D smal_npy（公开真实层口径）
# 数据: data/processed/p01/ 由 scripts/export_interpet4d.py 导出（225 clips, T=64, V=25 NTU 兼容视图）
# 口径: kNN probe 标签 = dog ID 12 类（InterPet4D v1 无行为标注，代理 probe 见 reports/p01 报告）

work_dir: runs/p01_aimclr_pretext

# feeder —— 官方 Feeder_triple，消费导出的 mmap npy
train_feeder: feeder.ntu_feeder.Feeder_triple
train_feeder_args:
  data_path: data/processed/p01/train_data.npy
  label_path: data/processed/p01/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

# model —— 官方 AimCLR + ST-GCN 编码器（NTU graph V=25）
model: net.aimclr.AimCLR
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 128
  queue_size: 1024        # 225 样本小数据集：官方 32768 不适用，取 ~4.5x 数据量
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16     # 1/4 x 标准 ST-GCN 通道
  hidden_dim: 256
  num_class: 12           # dog ID 类数（实测口径；预训练不使用标签，kNN probe 用）
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# optim —— 官方 SGD 配方，lr 按 bs 线性缩放（0.1@128 → 0.05@64）
nesterov: False
weight_decay: 1e-4
base_lr: 0.05
optimizer: SGD
step: [80]

# training —— RTX 5060 Laptop 8GB 单卡
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 120
start_epoch: 0
stream: 'joint'

# nearest neighbor mining
topk: 1
mining_epoch: 60

# log
save_interval: 20
eval_interval: -1
print_log: True
