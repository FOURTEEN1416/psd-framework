# W20 P0.5 公开真实层部分类协议配置（v2 — 用户裁决后 C 路线版）
#
# 裁决记录（2026-08-24, 用户拍板）:
#   ① 骨架路线 = C: 犬科 mp4 自提取（YOLO11-pose + dog-pose 微调权重, 24 点 K9Graph 同拓扑）
#   ② 门禁口径 = 宽松: train+val 合计 ≥10 视频 → 可训练类 jump/stay/track/watch (4 类)
#   ③ 样本判定 = R2(first-mapped-hit): 标签序列中首个属于可训练 4 类的动作
protocol: public_real_partialclass
version: w20-v2_c_route_2026-08-24

data:
  dataset: animal_kingdom_canine
  annotation_root: D:\Desktop\k9-training-system\data\animal_kingdom\action_recognition\annotation
  metadata_xlsx: D:\Desktop\k9-training-system\data\animal_kingdom\action_recognition\AR_metadata.xlsx
  video_dir: D:\Desktop\k9-training-system\data\animal_kingdom\action_recognition\dataset\video
  video_tar_gz: D:\Desktop\k9-training-system\data\animal_kingdom\action_recognition\dataset\video.tar.gz
  canine_filter: w2-caliber-A            # list_animal ∩ 精确10物种 = 329 视频

mapping:
  module: psd.data.ak_mapping            # 权威映射（df_action.xlsx index 真值）
  truth_source: df_action.xlsx index 列
  full_mapped_pool_12: [sit, down, stand, stay, bark, bite, track, apprehend, watch, retrieve, jump, scale]
  gate_classes: [stay, track, watch, jump]   # 宽松门禁可训练 4 类（assets-map 相对顺序 → idx 0..3）
  trainable_class_count: 4
  excluded_classes: [heel, sit_up, alert_sit, alert_down, escort, recall, guard, release, search_blind, obstacle]

skeleton_route:
  route: C_self_extract                  # 用户裁决 C 路线
  pose_model: yolo11s-pose               # ultralytics; dog-pose 微调
  pose_topo: k9graph24                   # dog-pose.yaml 24 点与 assets-map §2 逐名逐序一致(零投影)
  finetune_data: dog-pose                # D:\Desktop\datasets\dog-pose (8476 图已预下载)
  finetune_cmd: python scripts/train_yolo_dogpose.py --epochs 50 --batch 16
  pose_weights: runs/public_real_yolo_dogpose/train/weights/best.pt
  pipeline_cmd: python scripts/run_p05_public_real_pipeline.py --stage extract --weights <best.pt>
  clip_t: 30
  manifest: runs/public_real_dataset/partialclass4_manifest.json
  dataset_pkl: runs/public_real_dataset/partialclass4_T30.pkl

training:
  init_from: runs/p05_stgcn_bc_full/best.pt   # Y 预训练 backbone; head 新建(4类)
  freeze_backbone: true
  gpu_gate: NTU Phase B(PID 35208)结束后启动; nvidia-smi 显存 <2GB 方可开训
  status: queued_gpu_relay               # 排队等 GPU 接力(W18 看护窗口或本窗夜间错峰)

report:
  stats_json: reports/p05-public-real-partialclass-stats-2026-08-24.json
  report_md: reports/p05-public-real-partialclass-2026-08-24.md
