# P0.5 主动学习效率实验 — 50 epoch 短预算版（W14 窗口，GPU 被 NTU 长训占用期间 CPU 执行）
#
# 运行:
#   .venv\Scripts\python.exe scripts\run_p05_al_efficiency.py --config configs/p05_al_short.yaml
#
# 目的: 管线跑通 + 曲线数据落盘；full-budget 版见 configs/p05_al_full.yaml

experiment:
  name: p05_al_efficiency_short
  layer: synthetic          # 三层口径: 合成层（AGENTS.md 硬规则 3）
  budgets: [20, 50, 100, 200]
  seeds: [42, 43, 44]
  strategies: [entropy, random]
  uncertainty_method: softmax_entropy   # 选型理由见 psd/training/active_learning.py 模块头

pool:
  samples_per_class: 10     # 22×10 = 220 ≥ 预算上限 200
  T: 30
  noise_std: 0.05
  seed: 20261               # 新种子，避开 W12 seed42 训练数据防记忆泄漏
val:
  samples_per_class: 15     # 22×15 = 330 固定 GT 验证集
  T: 30
  noise_std: 0.05
  seed: 20262

model:
  in_channels: 3
  num_classes: 22
  base_channels: 64
  num_stages: 10

train:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50                # 短预算（用户指定）；full 版 120
  batch_size: 32            # 小样本轮自动 min(32, n_train) 防 drop_last 空 loader
  warmup_epochs: 5
  early_stopping: false
  patience: 25
  use_amp: false
  device: cpu               # GPU 被占用；full 版改 auto
  output_dir: runs/p05_al_efficiency/short

pool_scoring:
  enabled: true
  pool_jsonl: data/processed/p04/pseudo_pool_main_consensus_a1.0_seed42.jsonl
  smal_npy_dir: D:/Desktop/k9-training-system/data/interpet4d/smal_npy
  ckpt: runs/p05_stgcn_bc_full/best.pt

output:
  report_json: reports/p05-al-efficiency-short-2026-08-24.json
  state_dir: runs/p05_al_efficiency/state_short
