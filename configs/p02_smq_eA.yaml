# P0.2 E-A 实验：修复编码器码塌缩——唯一变量 mse_loss_weight 0.001→1.0
# 假设（W7 Step A 实证链）：commit(1.0)≫recon(0.001) 梯度失衡致编码器输出塌向
#   单点（latent patch 间 cos=0.999999），VQ 随之单码化。给重建梯度正常话语权。
# 其余全部继承 v3 基线（官方默认超参，忠实移植已核对 external/SMQ/main.py）。

run_name: "p02_smq_eA"

data_root: "D:/Desktop/k9-training-system/data/interpet4d/smal_npy"
